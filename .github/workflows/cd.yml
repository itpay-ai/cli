name: CD — Publish to npm

# Manual only. Ready next releases have standing Owner approval; latest needs separate approval.
on:
  workflow_dispatch:
    inputs:
      approval_reason:
        description: User-approved reason for this exact run (include approval reference)
        required: true
        type: string
      action:
        description: Publish checked main to next, promote, verify OIDC or do a read-only next check
        type: choice
        options: [publish, promote, verify, readback]
        default: publish
      tag:
        description: next for publish; final channel for promote/verify/readback
        type: choice
        options: [next, latest]
        default: next
      version:
        description: Exact existing version for promote/verify/readback
        type: string
        required: false

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && inputs.action == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted workflow policy
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@11.21.0
      - name: Verify routing and approved source
        run: node --test scripts/npm-release.test.mjs scripts/npm-release-source.test.mjs
      - name: Checkout candidate without publish permission
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
      - name: Install and check candidate
        working-directory: candidate
        run: |
          npm ci
          npm run check
      - name: Pack checked candidate and record actual source
        run: node scripts/npm-release-source.mjs pack
        env:
          RELEASE_ACTION: ${{ inputs.action || 'publish' }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CHECKOUT: candidate
      - name: Preserve exact artifact for protected publication
        uses: actions/upload-artifact@v4
        with:
          name: cli-release
          path: release-artifact/
          if-no-files-found: error

  publish:
    needs: prepare
    if: always() && github.ref == 'refs/heads/main' && (needs.prepare.result == 'success' || (github.event_name == 'workflow_dispatch' && (inputs.action == 'promote' || inputs.action == 'verify')))
    runs-on: ubuntu-latest
    environment: npm-publish
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout trusted publisher only
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Pin npm with OIDC support
        run: npm install --global npm@11.21.0
      - name: Download checked artifact
        if: inputs.action == 'publish'
        uses: actions/download-artifact@v4
        with:
          name: cli-release
          path: release-artifact
      - name: Verify trusted release routing
        run: node --test scripts/npm-release.test.mjs scripts/npm-release-source.test.mjs
      - name: Publish exact artifact or promote approved version
        run: node scripts/npm-release.mjs
        env:
          RELEASE_ACTION: ${{ inputs.action || 'publish' }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
  readback:
    needs: publish
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
          (inputs.action == 'readback' || (inputs.action == 'publish' && needs.publish.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout read-only verification policy
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Read original checked artifact metadata
        if: inputs.action == 'publish'
        uses: actions/download-artifact@v4
        with:
          name: cli-release
          path: release-artifact
      - name: Verify exact npm next artifact without writes
        run: node scripts/npm-release.mjs
        env:
          RELEASE_ACTION: readback
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_MANIFEST: ${{ inputs.action == 'publish' && 'release-artifact/manifest.json' || '' }}
      - name: Verify public dev Agent entry follows next
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=$RELEASE_VERSION
          if [[ -f release-artifact/manifest.json ]]; then version=$(jq -er .version release-artifact/manifest.json); fi
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          deadline=$((SECONDS+240))
          while (( SECONDS < deadline )); do
            if status=$(curl --silent --show-error --max-time 10 --output "$body" --write-out '%{http_code}' https://dev.itpay.ai/agent); then
              case "$status" in
                403|429) echo "::error::dev Agent read stopped at HTTP $status"; exit 1 ;;
                200)
                  if grep -Eqi 'just a moment|verify you are human|challenge-platform' "$body"; then
                    echo "::error::dev Agent read returned a challenge"; exit 1
                  fi
                  if grep -Fq "**@itpay/cli $version**" "$body"; then
                    printf "GET https://dev.itpay.ai/agent: HTTP 200, version=%s\n" "$version"
                    exit 0
                  fi ;;
              esac
            fi
            sleep 10
          done
          echo "::error::npm was published, but the public dev Agent entry did not converge to $version"
          exit 1
