name: CD — Publish to npm

# Manual only: explain the need and obtain user approval before each Actions run.
on:
  workflow_dispatch:
    inputs:
      approval_reason:
        description: User-approved reason for this exact run (include approval reference)
        required: true
        type: string
      action:
        description: Stage a checked artifact, promote after Backend validation, or verify OIDC
        type: choice
        options: [stage, promote, verify]
        default: stage
      source:
        description: Main or an exact internal source approved in npm-release-sources.json
        type: choice
        options: [main, dev, prod]
        default: main
      tag:
        description: Final channel for promote/verify only
        type: choice
        options: [next, latest]
        default: next
      version:
        description: Exact existing version for promote/verify
        type: string
        required: false

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.action == 'stage')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted workflow policy
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@11.21.0
      - name: Verify routing and approved source
        run: node --test scripts/npm-release.test.mjs scripts/npm-release-source.test.mjs
      - name: Select fixed internal source
        id: source
        run: node scripts/npm-release-source.mjs select
        env:
          RELEASE_SOURCE: ${{ inputs.source || 'main' }}
      - name: Checkout candidate without publish permission
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: candidate
          persist-credentials: false
      - name: Install and check candidate
        working-directory: candidate
        run: |
          npm ci
          npm run check
      - name: Pack checked candidate and record actual source
        run: node scripts/npm-release-source.mjs pack
        env:
          RELEASE_SOURCE: ${{ inputs.source || 'main' }}
          RELEASE_CHECKOUT: candidate
      - name: Preserve exact artifact for protected publication
        uses: actions/upload-artifact@v4
        with:
          name: cli-release
          path: release-artifact/
          if-no-files-found: error

  publish:
    needs: prepare
    if: always() && github.ref == 'refs/heads/main' && (needs.prepare.result == 'success' || (github.event_name == 'workflow_dispatch' && (inputs.action == 'promote' || inputs.action == 'verify')))
    runs-on: ubuntu-latest
    environment: npm-publish
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout trusted publisher only
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Pin npm with OIDC support
        run: npm install --global npm@11.21.0
      - name: Download checked artifact
        if: github.event_name == 'push' || inputs.action == 'stage'
        uses: actions/download-artifact@v4
        with:
          name: cli-release
          path: release-artifact
      - name: Verify trusted release routing
        run: node --test scripts/npm-release.test.mjs scripts/npm-release-source.test.mjs
      - name: Publish exact artifact or promote approved version
        run: node scripts/npm-release.mjs
        env:
          RELEASE_ACTION: ${{ inputs.action || 'stage' }}
          RELEASE_SOURCE: ${{ inputs.source || 'main' }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
