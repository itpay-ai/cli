name: CI

# Manual only: explain the need and obtain user approval before each Actions run.
on:
  workflow_dispatch:
    inputs:
      approval_reason:
        description: User-approved reason for this exact run (include approval reference)
        required: true
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Verify npm release routing
        run: node --test scripts/npm-release.test.mjs scripts/npm-release-source.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, and verify packed CLI
        run: npm run check

  buyer-package:
    name: Buyer package / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['18', '20', '22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:package
