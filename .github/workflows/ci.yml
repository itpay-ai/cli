name: CI

on:
  workflow_dispatch:
    inputs:
      approval_reason:
        description: User-approved reason for this exact Windows upgrade experiment
        required: true
        type: string

jobs:
  windows-original-upgrade:
    name: Windows old published package to main original receipt
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Stage both exact private test inputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .upgrade-inputs/old, .upgrade-inputs/candidate | Out-Null
          npm pack @itpay/cli@0.2.92 --registry https://registry.npmjs.org --ignore-scripts --pack-destination .upgrade-inputs/old
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm pack --ignore-scripts --pack-destination .upgrade-inputs/candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the same receipt and identity through the two installed artifacts
        shell: pwsh
        run: |
          $env:npm_execpath = Join-Path (Split-Path (Get-Command node.exe).Source) 'node_modules/npm/bin/npm-cli.js'
          node scripts/windows-original-upgrade-smoke.mjs .upgrade-inputs/old/itpay-cli-0.2.92.tgz .upgrade-inputs/candidate/itpay-cli-0.2.92.tgz
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
